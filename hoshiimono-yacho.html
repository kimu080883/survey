<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1B3B2F">
<title>欲しいもの野帳</title>
<style>
:root{
  --cover:#1B3B2F;      /* 野帳の表紙 */
  --cover-2:#2E6B4F;
  --paper:#F2F4EF;
  --card:#FBFCFA;
  --rule:#D5DED4;
  --ink:#20302B;
  --ink-2:#6B7A72;
  --pen:#1F3A5F;        /* ボールペン藍 */
  --red:#B4342A;        /* 検算の朱 */
  --amber:#B77B12;
  --radius:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--rule) 1px,transparent 1px),
    linear-gradient(90deg,var(--rule) 1px,transparent 1px);
  background-size:24px 24px;
  font-size:15px;line-height:1.6;
  padding-bottom:120px;
  -webkit-text-size-adjust:100%;
}
.num{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---- 表紙（ヘッダー） ---- */
.cover{
  background:var(--cover);color:#EAF0EA;
  padding:calc(env(safe-area-inset-top) + 18px) 18px 16px;
  border-bottom:3px solid var(--cover-2);
}
.cover h1{
  margin:0;font-size:21px;font-weight:600;letter-spacing:.18em;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
}
.cover p{margin:4px 0 0;font-size:11.5px;color:#9DB5A6;letter-spacing:.06em}

/* ---- 集計欄 ---- */
.ledger{
  margin:-1px 0 0;background:var(--cover);
  padding:0 12px 14px;
}
.ledger-inner{
  display:grid;grid-template-columns:1.4fr 1fr 1fr;
  background:var(--card);border-radius:var(--radius);overflow:hidden;
  box-shadow:0 2px 0 rgba(0,0,0,.18);
}
.cell{padding:10px 8px 11px;border-left:1px solid var(--rule)}
.cell:first-child{border-left:0;background:linear-gradient(180deg,#fff,#F4F7F2)}
.cell .lbl{font-size:10.5px;color:var(--ink-2);letter-spacing:.08em;display:block}
.cell .val{display:block;font-size:19px;font-weight:600;margin-top:2px;color:var(--pen)}
.cell:first-child .val{font-size:25px;color:var(--cover)}
.cell .sub{font-size:10px;color:var(--ink-2)}
.cell.repl .val{color:var(--red)}

/* ---- タブ ---- */
.tabs{display:flex;gap:6px;padding:12px 12px 0}
.tab{
  flex:1;padding:9px 4px;border:1px solid var(--rule);border-bottom:0;
  background:#E8EDE6;color:var(--ink-2);font-size:13px;font-weight:600;
  border-radius:8px 8px 0 0;cursor:pointer;text-align:center;
}
.tab.on{background:var(--card);color:var(--cover);box-shadow:inset 0 3px 0 var(--cover-2)}

.sheet{background:var(--card);border:1px solid var(--rule);border-radius:0 0 var(--radius) var(--radius);margin:0 12px;padding:12px}
.pane{display:none}
.pane.on{display:block}

/* ---- フィルタ ---- */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.chip{
  white-space:nowrap;padding:5px 11px;border-radius:14px;border:1px solid var(--rule);
  background:#fff;color:var(--ink-2);font-size:12.5px;cursor:pointer
}
.chip.on{background:var(--cover);border-color:var(--cover);color:#fff}
.row-tools{display:flex;gap:8px;align-items:center;margin-top:8px}
select.mini{
  flex:1;padding:7px 8px;border:1px solid var(--rule);border-radius:7px;background:#fff;
  font-size:12.5px;color:var(--ink);font-family:inherit
}

/* ---- 明細 ---- */
.item{
  position:relative;background:#fff;border:1px solid var(--rule);
  border-left:4px solid var(--cover-2);border-radius:8px;
  padding:10px 11px;margin-top:9px;
}
.item.replace{border-left-color:var(--red)}
.item.bought{border-left-color:#9AA8A0;background:#F7F8F6}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tag{font-size:10.5px;padding:2px 7px;border-radius:4px;background:#E6EDE7;color:var(--cover);letter-spacing:.04em}
.tag.rep{background:#F6E3E1;color:var(--red);font-weight:700}
.tag.pri1{background:#FBEEDC;color:var(--amber);font-weight:700}
.price{font-size:18px;font-weight:600;white-space:nowrap;color:var(--pen)}
.price.tbd{font-size:13px;color:var(--ink-2);font-weight:500}
.name{margin:5px 0 0;font-size:15.5px;font-weight:600;word-break:break-word}
.memo{margin:3px 0 0;font-size:12.5px;color:var(--ink-2);white-space:pre-wrap;word-break:break-word}
.acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.btn{
  border:1px solid var(--rule);background:#fff;color:var(--ink);
  padding:7px 11px;border-radius:7px;font-size:12.5px;cursor:pointer;font-family:inherit
}
.btn:active{transform:translateY(1px)}
.btn.jump{background:var(--cover);border-color:var(--cover);color:#fff;font-weight:700;letter-spacing:.04em}
.btn.ok{background:#E6EDE7;border-color:#C3D3C6;color:var(--cover);font-weight:600}
.btn.del{color:var(--red)}
.host{font-size:10.5px;color:var(--ink-2);margin-left:2px;align-self:center}

/* ---- 空 ---- */
.empty{text-align:center;color:var(--ink-2);font-size:13px;padding:34px 12px;line-height:1.9}

/* ---- 月・集計 ---- */
.mhead{
  display:flex;justify-content:space-between;align-items:baseline;
  margin:16px 0 2px;padding-bottom:5px;border-bottom:2px solid var(--cover);
}
.mhead b{font-size:13.5px;letter-spacing:.06em}
.mhead span{font-size:15px;font-weight:600;color:var(--pen)}
.bar-row{margin-top:11px}
.bar-line{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px}
.bar-line b{font-weight:600}
.bar-line span{font-weight:600;color:var(--pen)}
.bar{height:7px;background:#E8EDE6;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cover-2);border-radius:4px}
.bar i.r{background:var(--red)}
.bar i.g{background:#9AA8A0}
h3.sec{font-size:12px;letter-spacing:.1em;color:var(--ink-2);margin:18px 0 0;font-weight:600}
h3.sec:first-child{margin-top:2px}

/* ---- 追加ボタン ---- */
.fab{
  position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 18px);
  background:var(--cover);color:#fff;border:0;border-radius:26px;
  padding:14px 20px;font-size:15px;font-weight:700;letter-spacing:.06em;
  box-shadow:0 6px 18px rgba(27,59,47,.35);cursor:pointer;font-family:inherit;z-index:40
}

/* ---- 入力シート ---- */
.overlay{position:fixed;inset:0;background:rgba(20,32,27,.5);display:none;z-index:50}
.overlay.on{display:block}
.form{
  position:fixed;left:0;right:0;bottom:0;z-index:51;
  background:var(--card);border-radius:14px 14px 0 0;
  padding:14px 16px calc(env(safe-area-inset-bottom) + 18px);
  max-height:92vh;overflow-y:auto;transform:translateY(102%);
  transition:transform .22s ease;box-shadow:0 -6px 24px rgba(0,0,0,.2)
}
.form.on{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.form{transition:none}}
.form h2{margin:2px 0 12px;font-size:15px;letter-spacing:.1em;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
label{display:block;font-size:11.5px;color:var(--ink-2);margin:11px 0 4px;letter-spacing:.06em}
input,textarea,select{
  width:100%;padding:11px;border:1px solid var(--rule);border-radius:8px;
  font-size:16px;font-family:inherit;background:#fff;color:var(--ink)
}
textarea{min-height:62px;resize:vertical;font-size:15px}
.two{display:flex;gap:9px}
.two>div{flex:1}
.seg{display:flex;gap:0;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{
  flex:1;padding:10px 2px;border:0;background:#fff;font-size:13px;
  color:var(--ink-2);font-family:inherit;cursor:pointer
}
.seg button.on{background:var(--cover);color:#fff;font-weight:700}
.seg.r button.on{background:var(--red)}
.form-acts{display:flex;gap:9px;margin-top:18px}
.form-acts .btn{flex:1;padding:13px;font-size:14.5px;font-weight:600}
.form-acts .save{background:var(--cover);border-color:var(--cover);color:#fff}

/* ---- データ管理 ---- */
.data-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.note{font-size:11.5px;color:var(--ink-2);margin-top:8px;line-height:1.8}

.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);
  background:var(--cover);color:#fff;padding:10px 18px;border-radius:20px;
  font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:60;white-space:nowrap
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
:focus-visible{outline:2px solid var(--cover-2);outline-offset:2px}
</style>
</head>
<body>

<header class="cover">
  <h1>欲しいもの野帳</h1>
  <p>買うもの・買い替えるものと、必要な金額の記録</p>
</header>

<div class="ledger">
  <div class="ledger-inner">
    <div class="cell">
      <span class="lbl">必要額（未購入）</span>
      <span class="val num" id="sumNeed">¥0</span>
      <span class="sub" id="sumNeedSub">0件</span>
    </div>
    <div class="cell repl">
      <span class="lbl">うち買替</span>
      <span class="val num" id="sumRepl">¥0</span>
      <span class="sub" id="sumReplSub">0件</span>
    </div>
    <div class="cell">
      <span class="lbl">購入済み累計</span>
      <span class="val num" id="sumPaid">¥0</span>
      <span class="sub" id="sumPaidSub">0件</span>
    </div>
  </div>
</div>

<nav class="tabs">
  <button class="tab on" data-pane="list">欲しいもの</button>
  <button class="tab" data-pane="paid">購入済み</button>
  <button class="tab" data-pane="stat">集計</button>
</nav>

<div class="sheet">

  <!-- 欲しいもの -->
  <section class="pane on" id="pane-list">
    <div class="chips" id="chips"></div>
    <div class="row-tools">
      <select class="mini" id="fStatus">
        <option value="all">すべて</option>
        <option value="want">新しく欲しい</option>
        <option value="replace">買い替え</option>
      </select>
      <select class="mini" id="fSort">
        <option value="new">追加が新しい順</option>
        <option value="pri">優先度順</option>
        <option value="high">金額が高い順</option>
        <option value="low">金額が安い順</option>
        <option value="cat">カテゴリー順</option>
      </select>
    </div>
    <div id="listBox"></div>
  </section>

  <!-- 購入済み -->
  <section class="pane" id="pane-paid">
    <div id="paidBox"></div>
  </section>

  <!-- 集計 -->
  <section class="pane" id="pane-stat">
    <div id="statBox"></div>
    <h3 class="sec">データ</h3>
    <div class="data-btns">
      <button class="btn" id="btnExport">バックアップを書き出す</button>
      <button class="btn" id="btnImport">読み込む</button>
      <button class="btn del" id="btnClear">すべて消す</button>
    </div>
    <input type="file" id="fileIn" accept="application/json,.json" style="display:none">
    <p class="note">データはこの端末のブラウザに保存されます。機種変更やSafariの履歴削除で消えるので、ときどき書き出して残してください。</p>
  </section>

</div>

<button class="fab" id="fabAdd">＋ 追加</button>

<div class="overlay" id="overlay"></div>
<form class="form" id="form" onsubmit="return false">
  <h2 id="formTitle">欲しいものを追加</h2>

  <label for="fName">品名</label>
  <input id="fName" type="text" placeholder="例：外部フィルター 2213" autocomplete="off">

  <div class="two">
    <div>
      <label for="fCat">カテゴリー</label>
      <select id="fCat"></select>
    </div>
    <div>
      <label for="fPrice">金額（円・未定なら空欄）</label>
      <input id="fPrice" type="number" inputmode="numeric" placeholder="12800">
    </div>
  </div>

  <label for="fUrl">商品ページのURL</label>
  <input id="fUrl" type="url" inputmode="url" placeholder="https://..." autocomplete="off">

  <label>区分</label>
  <div class="seg r" id="segStatus">
    <button type="button" data-v="want" class="on">新しく欲しい</button>
    <button type="button" data-v="replace">買い替え</button>
  </div>

  <label>優先度</label>
  <div class="seg" id="segPri">
    <button type="button" data-v="1">高</button>
    <button type="button" data-v="2" class="on">中</button>
    <button type="button" data-v="3">低</button>
  </div>

  <label for="fMemo">メモ（今使っている物の状態・買い替え時期など）</label>
  <textarea id="fMemo" placeholder="例：2013年購入。異音あり。年内に廃棄予定。"></textarea>

  <div class="form-acts">
    <button type="button" class="btn" id="btnCancel">やめる</button>
    <button type="button" class="btn save" id="btnSave">保存する</button>
  </div>
</form>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

const KEY = 'hoshiimono_yacho_v1';
const DEFAULT_CATS = ['熱帯魚','庭','ガジェット','工具','日用品','その他'];
let state = { items: [], cats: DEFAULT_CATS.slice() };
let filterCat = 'all', editId = null;

/* ---------- 保存（アプリ内ストレージ / 端末ストレージ 両対応） ---------- */
async function save(){
  const json = JSON.stringify(state);
  if (window.storage && window.storage.set) {
    try { await window.storage.set(KEY, json); return; } catch(e){}
  }
  try { localStorage.setItem(KEY, json); } catch(e){}
}
async function load(){
  let json = null;
  if (window.storage && window.storage.get) {
    try { const r = await window.storage.get(KEY); if (r && r.value) json = r.value; } catch(e){}
  }
  if (json === null) { try { json = localStorage.getItem(KEY); } catch(e){} }
  if (!json) return;
  try {
    const d = JSON.parse(json);
    if (d && Array.isArray(d.items)) state.items = d.items;
    if (d && Array.isArray(d.cats) && d.cats.length) state.cats = d.cats;
  } catch(e){}
}

/* ---------- 小道具 ---------- */
const $  = s => document.querySelector(s);
const yen = n => '¥' + Math.round(Number(n)||0).toLocaleString('ja-JP');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PRI = {1:'高',2:'中',3:'低'};
function host(u){ try { return new URL(u).hostname.replace(/^www\./,''); } catch(e){ return ''; } }
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._id); t._id = setTimeout(()=>t.classList.remove('on'), 1700);
}
function ym(iso){ return iso ? iso.slice(0,7) : ''; }
function today(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}

/* ---------- 集計 ---------- */
function totals(){
  let need=0, needN=0, repl=0, replN=0, paid=0, paidN=0, tbd=0;
  state.items.forEach(it=>{
    const p = Number(it.price)||0;
    if (it.status === 'bought') { paid += p; paidN++; }
    else {
      need += p; needN++;
      if (!it.price) tbd++;
      if (it.status === 'replace') { repl += p; replN++; }
    }
  });
  return {need,needN,repl,replN,paid,paidN,tbd};
}
function renderLedger(){
  const t = totals();
  $('#sumNeed').textContent = yen(t.need);
  $('#sumNeedSub').textContent = t.needN + '件' + (t.tbd ? '（金額未定 '+t.tbd+'）' : '');
  $('#sumRepl').textContent = yen(t.repl);
  $('#sumReplSub').textContent = t.replN + '件';
  $('#sumPaid').textContent = yen(t.paid);
  $('#sumPaidSub').textContent = t.paidN + '件';
}

/* ---------- カテゴリーのチップ ---------- */
function renderChips(){
  const box = $('#chips');
  const counts = {};
  state.items.forEach(it=>{ if(it.status!=='bought') counts[it.cat]=(counts[it.cat]||0)+1; });
  const open = state.items.filter(i=>i.status!=='bought').length;
  let h = '<button class="chip'+(filterCat==='all'?' on':'')+'" data-cat="all">すべて '+open+'</button>';
  state.cats.forEach(c=>{
    h += '<button class="chip'+(filterCat===c?' on':'')+'" data-cat="'+esc(c)+'">'+esc(c)+' '+(counts[c]||0)+'</button>';
  });
  box.innerHTML = h;
  box.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ filterCat=b.dataset.cat; renderChips(); renderList(); });
}

/* ---------- 欲しいもの一覧 ---------- */
function renderList(){
  const st = $('#fStatus').value, sort = $('#fSort').value;
  let list = state.items.filter(i=>i.status!=='bought');
  if (filterCat!=='all') list = list.filter(i=>i.cat===filterCat);
  if (st!=='all') list = list.filter(i=>i.status===st);

  const catIdx = c => { const i = state.cats.indexOf(c); return i<0 ? 999 : i; };
  list.sort((a,b)=>{
    if (sort==='high') return (Number(b.price)||0)-(Number(a.price)||0);
    if (sort==='low')  return (Number(a.price)||0)-(Number(b.price)||0);
    if (sort==='pri')  return (a.pri-b.pri) || (b.createdAt||0)-(a.createdAt||0);
    if (sort==='cat')  return (catIdx(a.cat)-catIdx(b.cat)) || (b.createdAt||0)-(a.createdAt||0);
    return (b.createdAt||0)-(a.createdAt||0);
  });

  const box = $('#listBox');
  if (!list.length){
    box.innerHTML = '<p class="empty">まだ記入がありません。<br>右下の「＋ 追加」から、欲しいものや買い替えたいものを書き込んでください。</p>';
    return;
  }

  const sub = list.reduce((s,i)=>s+(Number(i.price)||0),0);
  let h = '<div class="mhead"><b>表示中 '+list.length+'件</b><span class="num">'+yen(sub)+'</span></div>';
  list.forEach(it=>{
    const hn = host(it.url);
    h += '<article class="item'+(it.status==='replace'?' replace':'')+'">'
      + '<div class="item-top"><div class="tags">'
      +   '<span class="tag">'+esc(it.cat)+'</span>'
      +   (it.status==='replace' ? '<span class="tag rep">買替</span>' : '')
      +   (it.pri==1 ? '<span class="tag pri1">優先 高</span>' : '')
      + '</div>'
      + (it.price ? '<div class="price num">'+yen(it.price)+'</div>' : '<div class="price tbd">金額未定</div>')
      + '</div>'
      + '<p class="name">'+esc(it.name)+'</p>'
      + (it.memo ? '<p class="memo">'+esc(it.memo)+'</p>' : '')
      + '<div class="acts">'
      +   (it.url ? '<button class="btn jump" data-act="jump" data-id="'+it.id+'">JUMP ↗</button><span class="host">'+esc(hn)+'</span>' : '')
      +   '<button class="btn ok" data-act="buy" data-id="'+it.id+'">買った</button>'
      +   '<button class="btn" data-act="edit" data-id="'+it.id+'">編集</button>'
      +   '<button class="btn del" data-act="del" data-id="'+it.id+'">削除</button>'
      + '</div></article>';
  });
  box.innerHTML = h;
}

/* ---------- 購入済み ---------- */
function renderPaid(){
  const list = state.items.filter(i=>i.status==='bought')
    .sort((a,b)=> (b.boughtAt||'').localeCompare(a.boughtAt||''));
  const box = $('#paidBox');
  if (!list.length){
    box.innerHTML = '<p class="empty">購入済みはまだありません。<br>一覧で「買った」を押すと、ここに使った金額が積み上がります。</p>';
    return;
  }
  const groups = {};
  list.forEach(it=>{ const k = ym(it.boughtAt)||'日付なし'; (groups[k]=groups[k]||[]).push(it); });
  let h = '';
  Object.keys(groups).sort().reverse().forEach(k=>{
    const g = groups[k], sum = g.reduce((s,i)=>s+(Number(i.price)||0),0);
    const label = k==='日付なし' ? k : k.slice(0,4)+'年'+Number(k.slice(5,7))+'月';
    h += '<div class="mhead"><b>'+label+'　'+g.length+'件</b><span class="num">'+yen(sum)+'</span></div>';
    g.forEach(it=>{
      h += '<article class="item bought">'
        + '<div class="item-top"><div class="tags">'
        +   '<span class="tag">'+esc(it.cat)+'</span>'
        +   '<span class="host">'+esc(it.boughtAt||'')+'</span></div>'
        + '<div class="price num">'+yen(it.price)+'</div></div>'
        + '<p class="name">'+esc(it.name)+'</p>'
        + (it.memo ? '<p class="memo">'+esc(it.memo)+'</p>' : '')
        + '<div class="acts">'
        +   (it.url ? '<button class="btn" data-act="jump" data-id="'+it.id+'">ページを開く ↗</button>' : '')
        +   '<button class="btn" data-act="unbuy" data-id="'+it.id+'">未購入に戻す</button>'
        +   '<button class="btn" data-act="edit" data-id="'+it.id+'">編集</button>'
        +   '<button class="btn del" data-act="del" data-id="'+it.id+'">削除</button>'
        + '</div></article>';
    });
  });
  box.innerHTML = h;
}

/* ---------- 集計 ---------- */
function renderStat(){
  const box = $('#statBox');
  if (!state.items.length){ box.innerHTML = '<p class="empty">記入があると、ここにカテゴリー別と月別の金額が出ます。</p>'; return; }

  const cat = {};
  state.items.forEach(it=>{
    const c = cat[it.cat] = cat[it.cat] || {need:0,repl:0,paid:0,n:0};
    const p = Number(it.price)||0;
    if (it.status==='bought') c.paid += p;
    else { c.need += p; c.n++; if (it.status==='replace') c.repl += p; }
  });
  const maxNeed = Math.max(1, ...Object.values(cat).map(c=>c.need));

  let h = '<h3 class="sec">カテゴリー別の必要額（未購入）</h3>';
  Object.keys(cat).sort((a,b)=>cat[b].need-cat[a].need).forEach(k=>{
    const c = cat[k];
    h += '<div class="bar-row"><div class="bar-line"><b>'+esc(k)+' <span style="color:var(--ink-2);font-weight:400">'+c.n+'件</span></b>'
      +  '<span class="num">'+yen(c.need)+'</span></div>'
      +  '<div class="bar"><i style="width:'+(c.need/maxNeed*100).toFixed(1)+'%"></i></div>'
      +  (c.repl ? '<div class="bar" style="margin-top:3px"><i class="r" style="width:'+(c.repl/maxNeed*100).toFixed(1)+'%"></i></div>' : '')
      +  '</div>';
  });
  h += '<p class="note">緑＝必要額の合計／赤＝そのうち買い替え分</p>';

  const mon = {};
  state.items.filter(i=>i.status==='bought'&&i.boughtAt).forEach(it=>{
    const k = ym(it.boughtAt); mon[k] = (mon[k]||0) + (Number(it.price)||0);
  });
  const keys = Object.keys(mon).sort().slice(-12);
  if (keys.length){
    const mx = Math.max(...keys.map(k=>mon[k]));
    const total = keys.reduce((s,k)=>s+mon[k],0);
    h += '<h3 class="sec">月別に使った金額（直近'+keys.length+'か月）</h3>';
    keys.slice().reverse().forEach(k=>{
      h += '<div class="bar-row"><div class="bar-line"><b>'+k.slice(0,4)+'/'+k.slice(5,7)+'</b>'
        +  '<span class="num">'+yen(mon[k])+'</span></div>'
        +  '<div class="bar"><i class="g" style="width:'+(mon[k]/mx*100).toFixed(1)+'%"></i></div></div>';
    });
    h += '<p class="note">この期間の合計 '+yen(total)+'　月平均 '+yen(total/keys.length)+'</p>';
  }
  box.innerHTML = h;
}

function renderAll(){ renderLedger(); renderChips(); renderList(); renderPaid(); renderStat(); }

/* ---------- 明細のボタン ---------- */
document.addEventListener('click', function(e){
  const b = e.target.closest('button[data-act]'); if(!b) return;
  const it = state.items.find(x=>x.id===b.dataset.id); if(!it) return;
  const act = b.dataset.act;

  if (act==='jump'){ window.open(it.url,'_blank','noopener'); return; }
  if (act==='buy'){
    it.status='bought'; it.boughtAt=today();
    save(); renderAll(); toast('購入済みにしました　'+yen(it.price));
  }
  if (act==='unbuy'){ it.status='want'; it.boughtAt=null; save(); renderAll(); toast('未購入に戻しました'); }
  if (act==='del'){
    if (!confirm('「'+it.name+'」を削除します。よろしいですか。')) return;
    state.items = state.items.filter(x=>x.id!==it.id);
    save(); renderAll(); toast('削除しました');
  }
  if (act==='edit') openForm(it);
});

/* ---------- タブ ---------- */
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    $('#pane-'+t.dataset.pane).classList.add('on');
    window.scrollTo({top:0,behavior:'smooth'});
  };
});
$('#fStatus').onchange = renderList;
$('#fSort').onchange   = renderList;

/* ---------- 入力シート ---------- */
function segSet(sel,v){
  document.querySelectorAll(sel+' button').forEach(b=>b.classList.toggle('on', b.dataset.v===String(v)));
}
function segGet(sel){ const b = document.querySelector(sel+' button.on'); return b ? b.dataset.v : null; }
document.querySelectorAll('#segStatus button,#segPri button').forEach(b=>{
  b.onclick = ()=>{ b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
});

function fillCats(sel){
  const s = $('#fCat');
  s.innerHTML = state.cats.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('')
              + '<option value="__new">＋ カテゴリーを作る…</option>';
  s.value = sel && state.cats.includes(sel) ? sel : (filterCat!=='all' ? filterCat : state.cats[0]);
}
$('#fCat').onchange = function(){
  if (this.value !== '__new') return;
  const name = (prompt('新しいカテゴリー名') || '').trim();
  if (name && !state.cats.includes(name)) { state.cats.push(name); save(); }
  fillCats(name || undefined);
};

function openForm(it){
  editId = it ? it.id : null;
  $('#formTitle').textContent = it ? '記入を直す' : '欲しいものを追加';
  $('#fName').value  = it ? it.name : '';
  $('#fPrice').value = it && it.price ? it.price : '';
  $('#fUrl').value   = it ? (it.url||'') : '';
  $('#fMemo').value  = it ? (it.memo||'') : '';
  fillCats(it ? it.cat : undefined);
  segSet('#segStatus', it ? (it.status==='replace'?'replace':'want') : 'want');
  segSet('#segPri', it ? it.pri : 2);
  $('#overlay').classList.add('on');
  $('#form').classList.add('on');
  setTimeout(()=>$('#fName').focus(), 250);
}
function closeForm(){
  $('#overlay').classList.remove('on');
  $('#form').classList.remove('on');
  editId = null;
}
$('#fabAdd').onclick = ()=>openForm(null);
$('#btnCancel').onclick = closeForm;
$('#overlay').onclick = closeForm;

$('#btnSave').onclick = function(){
  const name = $('#fName').value.trim();
  if (!name){ $('#fName').focus(); toast('品名を入れてください'); return; }
  let url = $('#fUrl').value.trim();
  if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
  const data = {
    name: name,
    cat: $('#fCat').value === '__new' ? state.cats[0] : $('#fCat').value,
    price: $('#fPrice').value === '' ? null : Math.max(0, Number($('#fPrice').value)||0),
    url: url,
    pri: Number(segGet('#segPri')) || 2,
    memo: $('#fMemo').value.trim()
  };
  if (editId){
    const it = state.items.find(x=>x.id===editId);
    const wasBought = it.status === 'bought';
    Object.assign(it, data);
    if (!wasBought) it.status = segGet('#segStatus');
    toast('直しました');
  } else {
    state.items.push(Object.assign({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      status: segGet('#segStatus'),
      boughtAt: null,
      createdAt: Date.now()
    }, data));
    toast('記入しました');
  }
  save(); renderAll(); closeForm();
};

/* ---------- データ ---------- */
$('#btnExport').onclick = function(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hoshiimono-' + today() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  toast('書き出しました');
};
$('#btnImport').onclick = ()=>$('#fileIn').click();
$('#fileIn').onchange = function(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.items)) throw 0;
      if (!confirm('読み込むと今のデータは置き換わります。よろしいですか。')) return;
      state.items = d.items;
      if (Array.isArray(d.cats) && d.cats.length) state.cats = d.cats;
      save(); renderAll(); toast('読み込みました');
    } catch(err){ alert('このファイルは読み込めません。書き出したJSONを選んでください。'); }
  };
  r.readAsText(f);
  e.target.value = '';
};
$('#btnClear').onclick = function(){
  if (!confirm('記入した内容をすべて消します。元に戻せません。')) return;
  if (!confirm('本当に消してよろしいですか。')) return;
  state = { items: [], cats: DEFAULT_CATS.slice() };
  save(); renderAll(); toast('すべて消しました');
};

/* ---------- 起動 ---------- */
load().then(renderAll);
})();
</script>
</body>
</html>
